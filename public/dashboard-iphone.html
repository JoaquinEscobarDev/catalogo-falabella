<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Reservas iPhone 18</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --iphone: #79c0ff;
      --iphone-dark: #58a6ff;
      --iphone-glow: rgba(121,192,255,.15);
    }

    body { padding-bottom: 60px; }

    /* ── Header ── */
    .dash-header {
      background: var(--surface);
      border-bottom: 1px solid var(--borde);
      padding: 0 24px;
      position: sticky; top: 0; z-index: 100;
    }
    .dash-header-inner {
      max-width: 1300px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 58px; gap: 12px;
    }
    .dash-title { font-size: 1.1rem; font-weight: 700; }
    .dash-title span { color: var(--iphone); }
    .header-actions { display: flex; gap: 8px; }
    .btn-sm {
      background: var(--surface-2); border: 1px solid var(--borde);
      color: var(--texto); border-radius: 8px; padding: 7px 14px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit; transition: border-color .2s;
    }
    .btn-sm:hover { border-color: var(--iphone); }
    .btn-sm.primary {
      background: var(--iphone); border-color: var(--iphone);
      color: var(--texto-inv);
    }
    .btn-sm.primary:hover { opacity: .88; border-color: var(--iphone); }

    /* ── Layout ── */
    .content { max-width: 1300px; margin: 0 auto; padding: 28px 24px; }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--borde);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .stat-label { font-size: .78rem; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .stat-value { font-size: 2rem; font-weight: 800; line-height: 1; }
    .stat-card.total .stat-value { color: var(--iphone); }
    .stat-card.pro   .stat-value { color: #bc8cff; }
    .stat-card.promax .stat-value { color: #f0883e; }
    .stat-card.duo   .stat-value { color: var(--verde); }

    /* ── QR card ── */
    .qr-card {
      background: var(--surface); border: 1px solid var(--borde);
      border-radius: var(--radius); padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 28px;
    }
    .qr-card img { width: 80px; height: 80px; border-radius: 6px; flex-shrink: 0; }
    .qr-card-text { display: flex; flex-direction: column; gap: 4px; }
    .qr-card-text span { font-size: .78rem; color: var(--texto-suave); text-transform: uppercase; letter-spacing: .5px; }
    .qr-card-text a { font-size: .9rem; color: var(--iphone); text-decoration: none; font-weight: 600; }

    /* ── Tabla ── */
    .table-section { background: var(--surface); border: 1px solid var(--borde); border-radius: var(--radius); overflow: hidden; }
    .table-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; gap: 12px; flex-wrap: wrap;
      border-bottom: 1px solid var(--borde);
    }
    .table-top h2 { font-size: 1rem; font-weight: 700; }
    .search-wrap { display: flex; align-items: center; gap: 8px; }
    #buscar {
      background: var(--surface-2); border: 1px solid var(--borde);
      border-radius: 8px; color: var(--texto); padding: 8px 12px;
      font-size: .9rem; outline: none; width: 220px; font-family: inherit;
      transition: border-color .2s;
    }
    #buscar:focus { border-color: var(--iphone); }
    #buscar::placeholder { color: var(--texto-suave); }

    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th {
      background: var(--surface-2); color: var(--texto-suave);
      text-transform: uppercase; letter-spacing: .4px; font-size: .75rem;
      padding: 10px 16px; text-align: left; white-space: nowrap;
      border-bottom: 1px solid var(--borde);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }

    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 20px;
      font-size: .75rem; font-weight: 700; white-space: nowrap;
    }
    .badge-pro     { background: rgba(188,140,255,.15); color: #bc8cff; }
    .badge-promax  { background: rgba(240,136,62,.15);  color: #f0883e; }
    .badge-duo     { background: rgba(63,185,80,.15);   color: var(--verde); }

    .empty-row td { text-align: center; color: var(--texto-suave); padding: 40px; }

    .error-banner {
      background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.35);
      border-radius: 10px; padding: 14px 20px; color: #f85149;
      font-size: .9rem; display: none; margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .content { padding: 20px 14px; }
      .dash-header { padding: 0 14px; }
      #buscar { width: 160px; }
    }
  </style>
</head>
<body>
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-title">📱 Reservas <span>iPhone 18</span></div>
      <div class="header-actions">
        <a href="/qr-iphone" class="btn-sm" target="_blank">Ver QR</a>
        <a href="/reserva-iphone" class="btn-sm" target="_blank">Formulario</a>
        <button class="btn-sm primary" id="btnExport">⬇ CSV</button>
      </div>
    </div>
  </header>

  <div class="content">
    <div class="error-banner" id="errorBanner"></div>
    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card total"><div class="stat-label">Total reservas</div><div class="stat-value" id="statTotal">—</div></div>
      <div class="stat-card pro">  <div class="stat-label">iPhone 18 Pro</div><div class="stat-value" id="statPro">—</div></div>
      <div class="stat-card promax"><div class="stat-label">Pro Max</div><div class="stat-value" id="statProMax">—</div></div>
      <div class="stat-card duo">  <div class="stat-label">iPhone Duo</div><div class="stat-value" id="statDuo">—</div></div>
    </div>

    <!-- QR -->
    <div class="qr-card">
      <img src="/api/reservas-iphone/qr" alt="QR Reserva iPhone 18">
      <div class="qr-card-text">
        <span>QR Formulario</span>
        <a href="/reserva-iphone" target="_blank">/reserva-iphone</a>
        <a href="/qr-iphone" target="_blank" style="margin-top:4px;font-size:.82rem">Pantalla completa →</a>
      </div>
    </div>

    <!-- Tabla -->
    <div class="table-section">
      <div class="table-top">
        <h2>Todas las reservas</h2>
        <div class="search-wrap">
          <input type="text" id="buscar" placeholder="Buscar nombre o teléfono…">
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Teléfono</th>
              <th>Modelo</th>
              <th>Almacenamiento</th>
              <th>Color</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let todasLasReservas = [];

    function count(arr, key) {
      return arr.reduce((m, r) => { m[r[key]] = (m[r[key]] || 0) + 1; return m; }, {});
    }

    function formatFecha(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('es-CL', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
             d.toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
    }

    function badgeModelo(modelo) {
      const cls = modelo.includes('Pro Max') ? 'badge-promax' : modelo.includes('Pro') ? 'badge-pro' : 'badge-duo';
      return `<span class="badge ${cls}">${modelo}</span>`;
    }

    function renderTabla(reservas) {
      const tbody = document.getElementById('tbody');
      if (!reservas.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No hay reservas aún</td></tr>';
        return;
      }
      tbody.innerHTML = reservas.map((r, i) => `
        <tr>
          <td style="color:var(--texto-suave)">${i + 1}</td>
          <td>${r.nombre}</td>
          <td>${r.apellido}</td>
          <td>${r.telefono}</td>
          <td>${badgeModelo(r.modelo)}</td>
          <td>${r.almacenamiento}</td>
          <td>${r.color}</td>
          <td style="color:var(--texto-suave);white-space:nowrap">${formatFecha(r.created_at)}</td>
        </tr>
      `).join('');
    }

    function actualizarStats(reservas) {
      const c = count(reservas, 'modelo');
      document.getElementById('statTotal').textContent  = reservas.length;
      document.getElementById('statPro').textContent    = c['iPhone 18 Pro'] || 0;
      document.getElementById('statProMax').textContent = c['iPhone 18 Pro Max'] || 0;
      document.getElementById('statDuo').textContent    = c['iPhone Duo'] || 0;
    }

    document.getElementById('buscar').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtradas = q
        ? todasLasReservas.filter(r =>
            `${r.nombre} ${r.apellido}`.toLowerCase().includes(q) ||
            r.telefono.toLowerCase().includes(q)
          )
        : todasLasReservas;
      renderTabla(filtradas);
    });

    document.getElementById('btnExport').addEventListener('click', () => {
      const header = ['ID','Nombre','Apellido','Teléfono','Modelo','Almacenamiento','Color','Fecha'];
      const rows = todasLasReservas.map(r => [
        r.id, r.nombre, r.apellido, r.telefono, r.modelo, r.almacenamiento, r.color,
        new Date(r.created_at).toLocaleString('es-CL')
      ]);
      const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: `reservas-iphone-${Date.now()}.csv` });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    async function cargar() {
      const banner = document.getElementById('errorBanner');
      banner.style.display = 'none';

      // 1. Cargar datos
      try {
        const res  = await fetch('/api/reservas-iphone');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
        todasLasReservas = Array.isArray(data.reservas) ? data.reservas : [];
      } catch (e) {
        banner.textContent = `⚠ Error al cargar reservas: ${e.message}`;
        banner.style.display = 'block';
        todasLasReservas = [];
        console.error('Error cargando reservas:', e);
      }

      // 2. Render stats y tabla
      actualizarStats(todasLasReservas);
      renderTabla(todasLasReservas);
    }

    cargar();
  </script>
</body>
</html>
