<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — Reserva iPhone 18</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 24px;
      padding: 32px 16px;
    }

    .logo { font-size: 3.5rem; }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #79c0ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--texto-suave);
      font-size: 1.05rem;
      max-width: 340px;
    }

    .qr-wrap {
      background: var(--surface);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .qr-wrap img {
      width: 260px;
      height: 260px;
      display: block;
      border-radius: 8px;
    }

    .url-chip {
      background: var(--surface-2);
      border: 1px solid var(--borde);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 0.95rem;
      color: #79c0ff;
      font-family: monospace;
      letter-spacing: 0.3px;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-link {
      background: var(--surface);
      border: 1px solid var(--borde);
      border-radius: 8px;
      color: var(--texto);
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .2s;
    }
    .btn-link:hover { border-color: #79c0ff; }
    .btn-link.primary {
      background: linear-gradient(135deg, #79c0ff, #bc8cff);
      color: #fff;
      border: none;
    }

    @media print {
      .actions { display: none; }
      body { background: white; color: black; }
      h1 { -webkit-text-fill-color: #000; }
      .subtitle { color: #555; }
      .qr-wrap { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="logo">📱</div>
  <h1>Reserva tu iPhone 18</h1>
  <p class="subtitle">Escanea el código QR o visita el link para registrar tu reserva</p>

  <div class="qr-wrap">
    <img src="/api/reservas-iphone/qr" alt="QR Reserva iPhone 18" id="qrImg">
  </div>

  <div class="url-chip" id="urlChip">/reserva-iphone</div>

  <div class="actions">
    <a href="/reserva-iphone" class="btn-link primary" target="_blank">Abrir formulario</a>
    <button class="btn-link" id="btnPng">⬇ Descargar PNG</button>
    <button class="btn-link" onclick="window.print()">🖨 Imprimir</button>
    <a href="/dashboard-iphone" class="btn-link">Dashboard</a>
  </div>

  <canvas id="cvs" style="display:none"></canvas>

  <script>
    document.getElementById('urlChip').textContent = window.location.origin + '/reserva-iphone';

    document.getElementById('btnPng').addEventListener('click', async () => {
      const btn = document.getElementById('btnPng');
      btn.textContent = 'Generando…';
      btn.disabled = true;
      try {
        // Cargar poster y QR en paralelo
        const [posterImg, qrImg] = await Promise.all([
          loadImage('/poster-iphone18.jpg'),
          fetch('/api/reservas-iphone/qr?print=1')
            .then(r => r.text())
            .then(svg => loadImage(URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }))))
        ]);

        const W = posterImg.naturalWidth;   // 1080
        const H = posterImg.naturalHeight;  // 1489

        const cvs = document.getElementById('cvs');
        cvs.width  = W;
        cvs.height = H;
        const ctx = cvs.getContext('2d');

        // Dibujar poster
        ctx.drawImage(posterImg, 0, 0);

        // Posición del QR en el poster (1080x1489)
        const qrX    = Math.round(W * 0.498);
        const qrY    = Math.round(H * 0.462);
        const qrSize = Math.round(W * 0.248);

        // Fondo blanco + QR encima
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(qrX, qrY, qrSize, qrSize);
        ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

        cvs.toBlob(blob => {
          const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(blob),
            download: 'poster-reserva-iphone18.png'
          });
          document.body.appendChild(a); a.click(); a.remove();
          btn.textContent = '⬇ Descargar PNG';
          btn.disabled = false;
        }, 'image/png');

      } catch (e) {
        console.error(e);
        btn.textContent = '⬇ Descargar PNG';
        btn.disabled = false;
      }
    });

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
  </script>
</body>
</html>
