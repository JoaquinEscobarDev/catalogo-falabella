<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — Reserva iPhone 18</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      gap: 24px;
      padding: 32px 16px;
    }

    .logo { font-size: 3.5rem; }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #79c0ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--texto-suave);
      font-size: 1.05rem;
      max-width: 340px;
    }

    .qr-wrap {
      background: var(--surface);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
      width: min(90vw, 420px);
    }
    .qr-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .url-chip {
      background: var(--surface-2);
      border: 1px solid var(--borde);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 0.95rem;
      color: #79c0ff;
      font-family: monospace;
      letter-spacing: 0.3px;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn-link {
      background: var(--surface);
      border: 1px solid var(--borde);
      border-radius: 8px;
      color: var(--texto);
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: border-color .2s;
    }
    .btn-link:hover { border-color: #79c0ff; }
    .btn-link.primary {
      background: linear-gradient(135deg, #79c0ff, #bc8cff);
      color: #fff;
      border: none;
    }

    @media print {
      .actions { display: none; }
      body { background: white; color: black; }
      h1 { -webkit-text-fill-color: #000; }
      .subtitle { color: #555; }
      .qr-wrap { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="logo">📱</div>
  <h1>Reserva tu iPhone 18</h1>
  <p class="subtitle">Escanea el código QR o visita el link para registrar tu reserva</p>

  <div class="qr-wrap">
    <img src="/api/reservas-iphone/qr" alt="QR Reserva iPhone 18" id="qrImg">
  </div>

  <div class="url-chip" id="urlChip">/reserva-iphone</div>

  <div class="actions">
    <a href="/reserva-iphone" class="btn-link primary" target="_blank">Abrir formulario</a>
    <button class="btn-link" id="btnPng">⬇ Descargar PNG</button>
    <button class="btn-link" onclick="window.print()">🖨 Imprimir</button>
    <a href="/dashboard-iphone" class="btn-link">Dashboard</a>
  </div>

  <canvas id="cvs" style="display:none"></canvas>

  <script>
    document.getElementById('urlChip').textContent = window.location.origin + '/reserva-iphone';

    document.getElementById('btnPng').addEventListener('click', async () => {
      const btn = document.getElementById('btnPng');
      btn.textContent = 'Generando…';
      btn.disabled = true;
      try {
        // Load poster and QR PNG in parallel
        const [posterImg, qrImg] = await Promise.all([
          loadImage('/poster-iphone18.jpg'),
          loadImage('/api/reservas-iphone/qr?print=1')
        ]);

        const W = posterImg.naturalWidth  || 1080;
        const H = posterImg.naturalHeight || 1489;

        const cvs = document.getElementById('cvs');
        cvs.width  = W;
        cvs.height = H;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(posterImg, 0, 0);

        // Posición del QR en el poster (1080x1489)
        // Verde: x=611-892, y=593-862 → interior (-15px borde cada lado)
        const qrX    = Math.round(W * 0.582);  // 628px
        const qrY    = Math.round(H * 0.408);  // 607px
        const qrSize = Math.round(W * 0.232);  // 251px

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(qrX, qrY, qrSize, qrSize);
        ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

        // toBlob wrapped as Promise so errors stay inside try/catch
        const blob = await new Promise((resolve, reject) => {
          try {
            cvs.toBlob(b => b ? resolve(b) : reject(new Error('toBlob devolvió null')), 'image/png');
          } catch (e) { reject(e); }
        });
        const blobUrl = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), {
          href: blobUrl,
          download: 'poster-reserva-iphone18.png'
        });
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(blobUrl);

      } catch (e) {
        console.error('Error generando poster:', e);
        alert('No se pudo generar la imagen: ' + e.message);
      } finally {
        btn.textContent = '⬇ Descargar PNG';
        btn.disabled = false;
      }
    });

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload  = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
  </script>
</body>
</html>
