<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Encuestas Electrónica</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .page-header {
      background: var(--surface); border-bottom: 1px solid var(--borde);
      padding: 0 24px;
    }
    .page-header-inner {
      max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; gap: 12px;
    }
    .page-title { font-size: 1.05rem; font-weight: 700; }
    .page-title span { color: #3fb950; }
    .btn-sm {
      background: var(--surface-2); border: 1px solid var(--borde);
      color: var(--texto); border-radius: 8px; padding: 7px 14px;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit; transition: border-color .2s;
    }
    .btn-sm:hover { border-color: #3fb950; }

    .content {
      max-width: 900px; margin: 0 auto; padding: 32px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .qr-card {
      background: var(--surface); border: 1px solid var(--borde);
      border-radius: var(--radius); padding: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }

    .qr-card-title {
      font-size: 1rem; font-weight: 700;
    }

    .qr-card-url {
      font-size: .75rem; color: var(--texto-suave);
      word-break: break-all;
    }

    .qr-img-wrap {
      width: 220px; height: 220px;
      background: #fff; border-radius: 12px;
      padding: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .qr-img-wrap img { width: 100%; height: auto; border-radius: 6px; }
    .qr-loading {
      color: #888; font-size: .85rem;
    }

    .qr-actions { display: flex; gap: 8px; }
    .btn-download {
      background: #3fb950; border: 1px solid #3fb950;
      color: #fff; border-radius: 8px; padding: 8px 16px;
      font-size: .85rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: opacity .2s;
    }
    .btn-download:hover { opacity: .85; }
    .btn-download:disabled { opacity: .5; cursor: default; }

    .badge-tienda {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .75rem; font-weight: 700;
    }
    .t-los-dominicos { background: rgba(121,192,255,.15); color: #79c0ff; }
    .t-parque-arauco  { background: rgba(188,140,255,.15); color: #bc8cff; }
    .t-costanera      { background: rgba(240,136,62,.15);  color: #f0883e; }
    .t-plaza-egana    { background: rgba(63,185,80,.15);   color: #3fb950; }

    @media (max-width: 600px) {
      .content { padding: 20px 14px; }
      .page-header { padding: 0 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-title">QR <span>Encuestas Electrónica</span></div>
      <a href="/dashboard-encuestas" class="btn-sm">📊 Dashboard</a>
    </div>
  </header>

  <div class="content">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const TIENDAS = [
      { slug: 'los-dominicos', nombre: 'Los Dominicos' },
      { slug: 'parque-arauco', nombre: 'Parque Arauco' },
      { slug: 'costanera',     nombre: 'Costanera' },
      { slug: 'plaza-egana',   nombre: 'Plaza Egaña' },
    ];

    async function descargar(slug, nombre, btn) {
      btn.disabled = true;
      btn.textContent = 'Descargando…';
      try {
        const res  = await fetch(`/api/encuestas/qr/${slug}`);
        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = Object.assign(document.createElement('a'), {
          href: url, download: `qr-encuesta-${slug}.png`
        });
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      } catch(e) {
        alert('Error al descargar: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '⬇ Descargar PNG';
      }
    }

    const grid = document.getElementById('grid');
    TIENDAS.forEach(({ slug, nombre }) => {
      const urlBase = `${location.origin}/encuesta/${slug}`;
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.innerHTML = `
        <span class="badge-tienda t-${slug}">${nombre}</span>
        <div class="qr-img-wrap">
          <img src="/api/encuestas/qr/${slug}" alt="QR ${nombre}" loading="lazy">
        </div>
        <div class="qr-card-url">${urlBase}</div>
        <div class="qr-actions">
          <button class="btn-download" data-slug="${slug}" data-nombre="${nombre}">⬇ Descargar PNG</button>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.btn-download');
      if (!btn) return;
      descargar(btn.dataset.slug, btn.dataset.nombre, btn);
    });
  </script>
</body>
</html>
